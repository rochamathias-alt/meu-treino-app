<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Meu Treino & Dieta</title>
<meta name="theme-color" content="#2a78d6" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Treino" />
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --surface-page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --border: rgba(11,11,11,0.10);
    --gridline: #e1e0d9;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --good: #0ca30c;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --surface-page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --border: rgba(255,255,255,0.10);
      --gridline: #2c2c2a;
      --series-1: #3987e5;
      --series-2: #d95926;
      --good: #0ca30c;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--surface-page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
    padding-top: env(safe-area-inset-top);
    min-height: 100vh;
  }
  #app {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px;
  }
  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 16px rgba(0,0,0,0.045);
  }
  .card.highlight {
    border-color: var(--series-1);
    background: linear-gradient(180deg, color-mix(in srgb, var(--series-1) 7%, var(--surface-1)), var(--surface-1) 65%);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
    background: var(--surface-page);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  .badge.accent { background: color-mix(in srgb, var(--series-1) 14%, transparent); color: var(--series-1); border-color: transparent; }
  .badge.today { background: var(--series-1); color: #fff; border-color: transparent; }
  h2 { margin: 0 0 4px; font-size: 1.3rem; }
  h3 { margin: 0 0 10px; font-size: 1.05rem; }
  .muted { color: var(--text-secondary); }
  .muted.small { font-size: 0.82rem; color: var(--text-muted); }
  .big { font-size: 1.4rem; font-weight: 600; margin: 4px 0; }

  label { display: block; margin: 10px 0 4px; font-size: 0.85rem; color: var(--text-secondary); }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-page);
    color: var(--text-primary);
    font-size: 1rem;
  }
  .grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .btn {
    display: inline-block;
    margin-top: 12px;
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: var(--series-1);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  .btn.secondary { background: var(--surface-page); color: var(--series-1); border: 1px solid var(--series-1); }
  .btn.danger { background: #d03b3b; }
  .btn.small { width: auto; margin-top: 0; padding: 6px 10px; font-size: 0.8rem; }

  .plan-list { list-style: none; margin: 10px 0 0; padding: 0; }
  .plan-item { padding: 8px 0; border-bottom: 1px solid var(--gridline); }
  .plan-item:last-child { border-bottom: none; }
  .plan-item-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 0.9rem; }
  .plan-item-head .btn.small { padding: 4px 12px; font-size: 0.95rem; line-height: 1; }
  .plan-item p { margin: 4px 0 0; }
  .plan-food-row { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
  .plan-food-label { flex: 0 0 84px; font-size: 0.78rem; color: var(--text-secondary); }
  .plan-food-row select { flex: 1; min-width: 0; font-size: 0.85rem; padding: 7px 8px; }
  .plan-grams { white-space: nowrap; font-size: 0.85rem; min-width: 42px; text-align: right; color: var(--series-1); }

  .shake-items { margin: 6px 0 0; padding-left: 18px; font-size: 0.88rem; }
  .shake-items li { margin-bottom: 2px; }

  .link-btn {
    background: none;
    border: none;
    color: var(--series-1);
    font-size: 0.82rem;
    padding: 6px 0;
    cursor: pointer;
    text-decoration: underline;
  }
  .adjust-toggle { margin-top: 8px; text-align: left; }
  .adjust-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 8px;
    padding: 8px 10px;
    border-radius: 10px;
    background: var(--surface-page);
    font-size: 0.82rem;
  }
  .adjust-panel {
    margin-top: 8px;
    padding: 10px;
    border-radius: 10px;
    background: var(--surface-page);
  }
  .adjust-options { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
  .adjust-options .btn.small { margin-top: 0; }

  .coach-note { color: var(--good); }
  .coach-box {
    margin-top: 8px;
    padding: 10px;
    border-radius: 10px;
    background: color-mix(in srgb, var(--good) 10%, var(--surface-page));
    border: 1px solid color-mix(in srgb, var(--good) 30%, var(--border));
  }
  .coach-options { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
  .coach-options .btn.small { margin-top: 0; }

  .meal-list li.meal-log-item { display: block; padding: 10px 0; border-bottom: 1px solid var(--gridline); }
  .meal-log-item:last-child { border-bottom: none; }
  .meal-log-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .portion-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .portion-btn {
    border: 1px solid var(--border);
    background: var(--surface-page);
    color: var(--text-secondary);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 0.78rem;
    cursor: pointer;
  }
  .portion-btn.active { background: var(--series-1); border-color: var(--series-1); color: #fff; }

  .progress-bar {
    height: 10px;
    background: var(--gridline);
    border-radius: 6px;
    overflow: hidden;
    margin: 8px 0;
  }
  .progress-fill { height: 100%; background: var(--series-1); border-radius: 6px; transition: width .3s; }

  .macro-row { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.88rem; color: var(--text-secondary); margin-top: 4px; }

  .ex-list { margin: 6px 0 0; padding-left: 18px; }
  .ex-list li { margin-bottom: 4px; }

  .focus-chip { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 0.88rem; color: var(--text-secondary); margin-top: 6px; }
  .focus-ico { font-size: 1rem; }

  .day-acc-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .day-acc {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface-page);
    overflow: hidden;
    transition: border-color .15s;
    margin-bottom: 0;
    padding-bottom: 0;
  }
  .day-acc[open] { border-color: color-mix(in srgb, var(--series-1) 45%, var(--border)); }
  .day-acc.today { border-color: var(--series-1); }
  .day-acc-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px;
    cursor: pointer;
    list-style: none;
    font-size: 0.92rem;
  }
  .day-acc-head::-webkit-details-marker { display: none; }
  .day-acc-name { font-weight: 700; }
  .day-acc-count { margin-left: auto; font-size: 0.76rem; color: var(--text-muted); }
  .day-acc-head .chev { font-size: 1.1rem; color: var(--text-muted); transition: transform .2s; }
  .day-acc[open] .day-acc-head .chev { transform: rotate(90deg); color: var(--series-1); }
  .day-acc-body { padding: 2px 14px 14px; background: var(--surface-1); }
  .rest-note { margin: 4px 0 0; color: var(--text-muted); font-size: 0.85rem; }

  .ex-rows { list-style: none; margin: 6px 0 0; padding: 0; }
  .ex-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--gridline); }
  .ex-row:last-child { border-bottom: none; }
  .ex-num {
    flex: 0 0 24px;
    height: 24px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--series-1) 14%, transparent);
    color: var(--series-1);
    font-size: 0.72rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ex-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .ex-name { font-size: 0.9rem; }
  .ex-meta { font-size: 0.76rem; color: var(--text-muted); }

  .workout-log-list { list-style: none; margin: 0; padding: 0; }
  .workout-log-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--gridline);
  }
  .workout-log-item:last-child { border-bottom: none; }
  .workout-log-stats { display: flex; gap: 6px; margin-top: 6px; }

  .food-results { max-height: 220px; overflow-y: auto; margin-top: 8px; border-radius: 10px; }
  .food-result-item {
    padding: 10px 8px;
    border-bottom: 1px solid var(--gridline);
    cursor: pointer;
  }
  .food-result-item:hover { background: var(--surface-page); }
  #food-add-form { margin-top: 10px; }
  #food-add-form.hidden { display: none; }
  .hidden { display: none; }

  details { margin-bottom: 8px; border-bottom: 1px solid var(--gridline); padding-bottom: 8px; }
  summary { cursor: pointer; font-weight: 600; padding: 6px 0; }

  .custom-food-details { margin-top: 14px; border-top: 1px solid var(--gridline); padding-top: 10px; }

  .meal-list { list-style: none; margin: 0; padding: 0; }
  .meal-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--gridline);
    gap: 8px;
  }
  .meal-kcal { display: flex; align-items: center; gap: 8px; font-weight: 600; white-space: nowrap; }
  .icon-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 1rem;
    cursor: pointer;
    padding: 4px;
  }

  .log-exercise {
    background: var(--surface-page);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .log-exercise:last-child { margin-bottom: 0; }
  .log-exercise-head { display: flex; align-items: center; gap: 10px; }
  .log-exercise-head .ex-title { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .log-exercise-head .ex-title b { font-size: 0.92rem; }
  .sets-row { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .set-input { display: flex; align-items: center; gap: 8px; }
  .set-input input { flex: 1; }
  .set-label {
    flex: 0 0 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 50%;
  }

  .video-link {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 11px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--series-1) 12%, transparent);
    color: var(--series-1);
    text-decoration: none;
    font-size: 0.76rem;
    font-weight: 600;
    white-space: nowrap;
    border: none;
    font-family: inherit;
    cursor: pointer;
  }
  .video-link:hover { background: color-mix(in srgb, var(--series-1) 22%, transparent); }

  #gif-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  #gif-modal.hidden { display: none; }
  .gif-modal-box {
    background: var(--surface-1);
    border-radius: var(--radius);
    padding: 14px;
    max-width: 360px;
    width: 100%;
  }
  .gif-modal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .gif-modal-head h3 { margin: 0; font-size: 1rem; }
  #gif-modal-img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    border-radius: 10px;
    background: var(--surface-page);
    margin-top: 10px;
    display: block;
  }
  .last-load {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 8px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 0.74rem;
    font-weight: 600;
    color: var(--good);
    background: color-mix(in srgb, var(--good) 14%, transparent);
  }
  .trend-up { color: var(--good); font-weight: 600; }
  .trend-down { color: #d03b3b; font-weight: 600; }

  .weekday-picker { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .weekday-picker label {
    display: flex;
    align-items: center;
    gap: 5px;
    margin: 0;
    font-size: 0.82rem;
    color: var(--text-primary);
    background: var(--surface-page);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .weekday-picker label:has(input:checked) {
    background: color-mix(in srgb, var(--series-1) 16%, transparent);
    border-color: var(--series-1);
    color: var(--series-1);
    font-weight: 600;
  }
  .weekday-picker input { width: auto; accent-color: var(--series-1); }

  .legend { display: flex; gap: 16px; margin-top: 8px; font-size: 0.85rem; color: var(--text-secondary); }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-item i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  canvas { width: 100%; height: 220px; display: block; }

  nav.tabbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    background: var(--surface-1);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 10;
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    padding: 10px 4px 8px;
    color: var(--text-muted);
    font-size: 0.7rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: pointer;
  }
  .tab-btn .ico { font-size: 1.25rem; }
  .tab-btn.active { color: var(--series-1); }
</style>
</head>
<body>
  <div id="app"></div>

  <div id="gif-modal" class="hidden">
    <div class="gif-modal-box">
      <div class="gif-modal-head">
        <h3 id="gif-modal-title"></h3>
        <button type="button" id="gif-modal-close" class="icon-btn">✕</button>
      </div>
      <img id="gif-modal-img" alt="Demonstração do exercício" />
      <p class="muted small">Demonstração ilustrativa do movimento</p>
    </div>
  </div>

  <nav class="tabbar">
    <button class="tab-btn active" data-tab="inicio"><span class="ico">🏠</span>Início</button>
    <button class="tab-btn" data-tab="alimentacao"><span class="ico">🍽️</span>Dieta</button>
    <button class="tab-btn" data-tab="treino"><span class="ico">💪</span>Treino</button>
    <button class="tab-btn" data-tab="progresso"><span class="ico">📈</span>Progresso</button>
    <button class="tab-btn" data-tab="perfil"><span class="ico">⚙️</span>Perfil</button>
  </nav>

  <script src="foods.js"></script>
  <script src="app.js"></script>
</body>
</html>
